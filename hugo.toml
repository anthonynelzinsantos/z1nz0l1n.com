baseURL = "https://z1nz0l1n.com/"
defaultContentLanguage = "en"
title = "Z1NZ0L1N"
enableEmoji = true
enableInlineShortcodes = true
disableKinds = ["taxonomy"]
summaryLength = 40
timeZone = "Europe/Paris"

# Dispatches at /d/<slug>/, wires at /w/<slug>/ (section lists at /d/ and /w/,
# set via url: in each _index.md). Old root URLs /<slug>/ are 301-redirected
# server-side in static/.htaccess.
[permalinks]
  dispatches = "/d/:slug/"
  wires      = "/w/:slug/"

# Taxonomies. "from" = locations (/from/<slug>/). Wires also classify by what
# they critique: "about" = medium (/about/<term>/) and "by" = creator (/by/<term>/).
# disableKinds=["taxonomy"] keeps the term-LIST pages off, so /about/<term>/
# doesn't collide with the /about/ content page (only term pages are built).
[taxonomies]
  location = "from"
  medium   = "about"
  creator  = "by"

[params]
  description = "Reading, writing, walking. Not (always) at the same time."
  subtitle = "by Anthony Nelzin-Santos"
  est = "est. 2025"
  author = "Anthony Nelzin-Santos"
  authorShort = "Anthony"
  email = "anthony@nelzin.fr"
  # Lexicon accent colour (LCH hue). Base = Purple; a seasonal cosine wave
  # swings it toward magenta/red at the summer solstice and blue-violet at
  # midwinter, easing continuously through the New Year (see partials/hue.html).
  baseHue = 298        # equinox / average hue (Purple)
  dynamicColour = true # set false to pin everything to baseHue
  hueAmplitude = 40    # peak swing each side of base (258 ↔ 338 by default)
  huePeakDay = 172     # day-of-year of the reddest hue (≈ 21 June solstice)

# Footer navigation (Ghost settings → navigation)
[[menu.main]]
  name = "Colophon"
  url = "/colophon/"
  weight = 1
[[menu.main]]
  name = "Blogroll"
  url = "/blogroll/"
  weight = 2
[[menu.main]]
  name = "Contact"
  url = "mailto:anthony@nelzin.fr?subject=Contact%20from%20Z1NZ0L1N"
  weight = 3
[[menu.main]]
  name = "Legal"
  url = "/legal/"
  weight = 4
[[menu.main]]
  name = "Styleguide"
  url = "/styleguide/"
  weight = 5

[imaging]
  quality = 82
  resampleFilter = "Lanczos"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]

[services.rss]
  limit = 10
